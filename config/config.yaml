# LLM provider configuration: openrouter, openai, ollama, or gemini
provider: ollama
# Model name for the selected provider
model: gemma4:latest
# Optional Ollama server URL (defaults to OLLAMA_HOST env or http://localhost:11434)
base_url: http://localhost:11434
# Whether the model is allowed to think natively (can be set to false for Ollama APIs)
think: false
# Optional global pacing for calls sent to the selected model. Zero disables it.
request_rate_limit_rpm: 0
# Repair limit shared by compile, visible-test, and judge feedback loops
max_repair_attempts: 5
# Judge backend: auto prefers online-judge-tools when available, python is the local fallback
judge_backend: auto
judge_time_limit_sec: 5
judge_compare_mode: ignore-spaces-and-newlines
